<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f7" />
  <meta name="description" content="Movies Download — private download library" />
  <title>Movies Download</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f6f7;
      --panel: rgba(255,255,255,.86);
      --text: #121214;
      --muted: #73737b;
      --line: rgba(18,18,20,.085);
      --soft: #f0f0f2;
      --button: #18181b;
      --buttonText: #fff;
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      padding: 32px 20px 44px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% -10%, rgba(255,255,255,.98), transparent 38%),
        radial-gradient(circle at 100% 100%, rgba(226,226,232,.65), transparent 40%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: min(100%, 720px); margin: 0 auto; }
    header { padding: 18px 2px 28px; }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: #8a8a92;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 52px);
      line-height: 1.02;
      letter-spacing: -.04em;
      font-weight: 740;
    }
    .sub {
      margin: 12px 0 0;
      max-width: 48ch;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .library {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(20,20,28,.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .item {
      display: grid;
      grid-template-columns: 48px minmax(0,1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 16px 17px;
    }
    .item + .item { border-top: 1px solid var(--line); }
    .icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--soft);
      color: #303036;
    }
    .icon svg { width: 21px; height: 21px; }
    .meta { min-width: 0; }
    .name {
      font-size: 15px;
      line-height: 1.2;
      font-weight: 690;
      letter-spacing: -.012em;
    }
    .details {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.25;
    }
    .button {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--button);
      color: var(--buttonText);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 680;
      white-space: nowrap;
      transition: transform .16s ease, opacity .16s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .button:hover { transform: translateY(-1px); opacity: .93; }
    .button:active { transform: translateY(0); }
    .button svg { width: 15px; height: 15px; }
    footer {
      padding: 14px 2px 0;
      color: #92929a;
      font-size: 11.5px;
      text-align: center;
    }
    @media (max-width: 600px) {
      body { padding: 22px 16px 32px; }
      header { padding: 12px 2px 22px; }
      .library { border-radius: 20px; }
      .item {
        grid-template-columns: 44px minmax(0,1fr);
        gap: 12px;
        padding: 15px;
      }
      .icon { width: 44px; height: 44px; border-radius: 13px; }
      .button {
        grid-column: 1 / -1;
        width: 100%;
        min-height: 43px;
        margin-top: 1px;
        border-radius: 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">Private library</p>
      <h1>Movies Download</h1>
      <p class="sub">Open the original MEGA folder for each title.</p>
    </header>

    <section class="library" aria-label="Movie downloads">
      <article class="item">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M8 5v14M16 5v14M3.5 9h4.5M16 9h4.5M3.5 15h4.5M16 15h4.5"/>
          </svg>
        </div>
        <div class="meta">
          <div class="name">Soul Kitchen</div>
          <div class="details">2 files · MEGA</div>
        </div>
        <a class="button" href="https://mega.nz/folder/ViEVQYTL#Jvs1ThhwH20Pf2pwbEzh2Q" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></svg>
          Download
        </a>
      </article>

      <article class="item">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M8 5v14M16 5v14M3.5 9h4.5M16 9h4.5M3.5 15h4.5M16 15h4.5"/>
          </svg>
        </div>
        <div class="meta">
          <div class="name">32 Frames</div>
          <div class="details">Documentary · 9/11 · MEGA</div>
        </div>
        <a class="button" href="https://mega.nz/folder/hvdGhbDK#tBUeU5-B7vk7y0TcDjzK9Q" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></svg>
          Download
        </a>
      </article>
    </section>

    <footer>Files are hosted on MEGA.</footer>
  </main>
</body>
</html>
